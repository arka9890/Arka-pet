name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Android project lives one level down; the repo root holds other projects.
        working-directory: arka-pet
    steps:
      - uses: actions/checkout@v4

      # Pin the debug keystore: every runner generates a fresh one, which changes the APK
      # signature each run and forces users to uninstall instead of upgrading. AGP resolves
      # the default debug keystore under $XDG_CONFIG_HOME/.android on this image (a fresh one
      # is generated there each run), while local builds use ~/.android — so restore both.
      - name: Restore signing keystore
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            for dir in "$HOME/.android" "${XDG_CONFIG_HOME:-$HOME/.config}/.android"; do
              mkdir -p "$dir"
              echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$dir/debug.keystore"
            done
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build and test
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arka-pet-debug
          path: arka-pet/app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            arka-pet/app/build/reports/tests/
            arka-pet/app/build/test-results/
          if-no-files-found: ignore
